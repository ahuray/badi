[package]
name = "badi-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local policy and suggestion broker for the Badi prototype"
publish = false

[lib]
name = "badi_broker"
path = "src/lib.rs"

[features]
default = []
local-model-eval = ["dep:reqwest", "dep:sha2"]

[[bin]]
name = "badi-broker"
path = "src/main.rs"

[[bin]]
name = "badictl"
path = "src/bin/badictl.rs"

[[bin]]
name = "badi-native-host"
path = "src/bin/badi-native-host.rs"

[[bin]]
name = "badi-native-manifest"
path = "src/bin/badi-native-manifest.rs"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["process", "fs"] }
sha2 = { version = "0.10", optional = true }
thiserror = "2"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.12"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
jsonschema = { version = "0.52", default-features = false }
tempfile = "3.21"

[lints]
workspace = true

[package]
name = "badi-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local policy and suggestion broker for the Badi prototype"
publish = false

[lib]
name = "badi_broker"
path = "src/lib.rs"

[features]
default = ["local-model"]
local-model = ["dep:sha2", "dep:unicode-script"]

[[bin]]
name = "badi-broker"
path = "src/main.rs"

[[bin]]
name = "badictl"
path = "src/bin/badictl/main.rs"

[[test]]
name = "owned_runtime"
harness = false
required-features = ["local-model"]

[dependencies]
async-trait = "0.1"
# Style-learning samples are sealed with XChaCha20-Poly1305 (RustCrypto).
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["process", "fs"] }
sha2 = { version = "0.11", optional = true }
thiserror = "2"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
# Hunspell-compatible checking and suggestions for enabled spelling languages
# (MPL-2.0); dictionaries come from the system packages, never the binary.
spellbook = "=0.4.2"
unicode-segmentation = "1.12"
unicode-script = { version = "0.5", optional = true }
uuid = { version = "1.18", features = ["serde", "v4"] }
whatlang = "=0.18.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }
jsonschema = { version = "0.59", default-features = false }
tempfile = "3.21"

[lints]
workspace = true

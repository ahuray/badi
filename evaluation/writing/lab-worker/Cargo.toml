[package]
name = "badi-writing-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prediction Lab worker: explicit local writing experiments on Badi's broker API"
publish = false

[lib]
name = "badi_writing_lab"
path = "src/lib.rs"

[[bin]]
name = "badi-writing-lab"
path = "src/main.rs"

# Features mirror the broker's own dependency declarations exactly, so a
# workspace build never unifies a new feature into the shipped binaries.
[dependencies]
badi-broker = { path = "../../../broker", features = ["local-model"] }
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.12"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.21"
tokio = { version = "1.47", features = ["test-util"] }

[lints]
workspace = true
